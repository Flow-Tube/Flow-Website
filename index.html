<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/flow-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Flow - A YouTube Client That Learns With You</title>
    <meta name="description" content="Flow is a modern, privacy-first Android YouTube client with an on-device recommendation engine. No ads, no tracking, just personalized content discovery." />
    <meta name="keywords" content="YouTube client, Android, privacy, neural engine, recommendations, open source, no ads" />
    <meta name="author" content="A-EDev" />
    
    <meta property="og:title" content="Flow - A YouTube Client That Learns With You" />
    <meta property="og:description" content="A modern, privacy-first Android YouTube client with an on-device recommendation engine." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flow.aedev.me" />
    <meta property="og:image" content="https://flow.aedev.me/og-image.png" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flow - A YouTube Client That Learns With You" />
    <meta name="twitter:description" content="A modern, privacy-first Android YouTube client with an on-device recommendation engine." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('flow-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
