name: Update Stats & Changelogs

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARS=$(gh api repos/A-EDev/Flow --jq .stargazers_count)
          FORKS=$(gh api repos/A-EDev/Flow --jq .forks_count)
          ISSUES=$(gh api repos/A-EDev/Flow --jq .open_issues_count)
          WATCHERS=$(gh api repos/A-EDev/Flow --jq .subscribers_count)
          # Count contributors using pagination
          CONTRIBUTORS=$(gh api repos/A-EDev/Flow/contributors --paginate --jq length | awk '{s+=$1} END {print s}')
          
          # Count downloads from releases
          DOWNLOADS=$(gh api repos/A-EDev/Flow/releases --paginate --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s}')
          DOWNLOADS=${DOWNLOADS:-0}
          
          # Create JSON content
          echo "{ \"stars\": $STARS, \"forks\": $FORKS, \"issues\": $ISSUES, \"watchers\": $WATCHERS, \"contributors\": $CONTRIBUTORS, \"downloads\": $DOWNLOADS }" > public/stats.json

      - name: Fetch Changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch every changelog file in a repo folder and tag it with its platform.
          # A missing folder yields no entries, so the Desktop tab stays empty until it exists.
          fetch_changelogs() {
            local repo=$1 path=$2 platform=$3
            gh api "repos/$repo/contents/$path" --jq '.[] | select(.type == "file") | .download_url' 2>/dev/null |
            while read -r url; do
              [ -z "$url" ] && continue
              content=$(curl -s "$url")
              status=$(echo "$content" | grep -i '^STATUS:' | sed -E 's/^STATUS:[[:space:]]*//i' | tr -d '\r' || echo "")
              jq -n --arg c "$content" --arg s "$status" --arg p "$platform" \
                '{"content": $c, "status": $s, "platform": $p}'
            done
          }

          {
            fetch_changelogs A-EDev/Flow app/src/main/assets/changelog android
            fetch_changelogs Flow-Tube/Flow-Desktop changelog desktop
          } | jq -s '.' > public/changelogs.json

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          if [[ -n $(git status -s public/stats.json public/changelogs.json) ]]; then
            git add public/stats.json public/changelogs.json
            git commit -m "Update stats and changelogs [skip ci]"
            git push
          else
            echo "No changes"
          fi
