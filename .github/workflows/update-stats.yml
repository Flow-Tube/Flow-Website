name: Update Stats & Changelogs

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARS=$(gh api repos/A-EDev/Flow --jq .stargazers_count)
          FORKS=$(gh api repos/A-EDev/Flow --jq .forks_count)
          ISSUES=$(gh api repos/A-EDev/Flow --jq .open_issues_count)
          WATCHERS=$(gh api repos/A-EDev/Flow --jq .subscribers_count)
          # Count contributors using pagination
          CONTRIBUTORS=$(gh api repos/A-EDev/Flow/contributors --paginate --jq length | awk '{s+=$1} END {print s}')
          
          # Count downloads from releases
          DOWNLOADS=$(gh api repos/A-EDev/Flow/releases --paginate --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s}')
          DOWNLOADS=${DOWNLOADS:-0}
          
          # Create JSON content
          echo "{ \"stars\": $STARS, \"forks\": $FORKS, \"issues\": $ISSUES, \"watchers\": $WATCHERS, \"contributors\": $CONTRIBUTORS, \"downloads\": $DOWNLOADS }" > public/stats.json

      - name: Fetch Changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch file download URLs from the changelog directory
          gh api repos/A-EDev/Flow/contents/app/src/main/assets/changelog --jq '.[].download_url' > changelog_urls.txt || echo "" > changelog_urls.txt
          
          echo "[" > public/changelogs.json
          first=1
          while read url; do
            [ -z "$url" ] && continue
            
            content=$(curl -s "$url")
            
            if [ $first -eq 0 ]; then echo "," >> public/changelogs.json; fi
            jq -n --arg c "$content" '{"content": $c}' >> public/changelogs.json
            first=0
          done < changelog_urls.txt
          echo "]" >> public/changelogs.json

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          if [[ -n $(git status -s public/stats.json public/changelogs.json) ]]; then
            git add public/stats.json public/changelogs.json
            git commit -m "Update stats and changelogs [skip ci]"
            git push
          else
            echo "No changes"
          fi
