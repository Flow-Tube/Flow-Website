<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow - Under Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            padding: 2rem;
            width: 90%;
            text-align: center;
        }

        .status {
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888888;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        p {
            color: #888888;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px 20px;
            border: 1px solid #333333;
            border-radius: 6px;
            background-color: #111111;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .github-link:hover {
            border-color: #555555;
            background-color: #1a1a1a;
        }

        .github-link svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status">Under Maintenance</div>
        <h1>We'll be right back.</h1>
        <p>The Flow website is currently being updated. Please check back later.</p>
